# Deploy dataset from data/ to ADLS bronze container (ship-bronze-data)
# Auth: (1) If AZURE_STORAGE_ACCOUNT_KEY secret is set, uses key auth (works immediately).
#       (2) Else uses service principal (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET); the SP must have "Storage Blob Data Contributor" on the storage account (e.g. via Terraform github_actions_sp_client_id).

name: Deploy data to ADLS

on:
  workflow_dispatch:   # Manual run from Actions tab
  push:
    branches: [main]
    paths:
      - 'data/**'

env:
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || 'shipsurveyetl' }}
  ADLS_CONTAINER: ship-bronze-data

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret '$v' is empty or not set. Add it in Settings → Secrets and variables → Actions. If this run is from a fork, secrets are not available—run from the main repo."
              exit 1
            fi
          done
          echo "All four Azure secrets are set."

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: true

      - name: Upload data to ADLS (ship-bronze-data)
        env:
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          if [ -n "$AZURE_STORAGE_ACCOUNT_KEY" ]; then
            echo "Using account key (AZURE_STORAGE_ACCOUNT_KEY)."
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --destination "$ADLS_CONTAINER" \
              --source ./data \
              --auth-mode key \
              --account-key "$AZURE_STORAGE_ACCOUNT_KEY" \
              --overwrite true
          else
            echo "Using service principal (login)."
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --destination "$ADLS_CONTAINER" \
              --source ./data \
              --auth-mode login \
              --overwrite true
          fi

      - name: List uploaded blobs
        env:
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          if [ -n "$AZURE_STORAGE_ACCOUNT_KEY" ]; then
            az storage blob list \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$ADLS_CONTAINER" \
              --auth-mode key \
              --account-key "$AZURE_STORAGE_ACCOUNT_KEY" \
              --output table
          else
            az storage blob list \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$ADLS_CONTAINER" \
              --auth-mode login \
              --output table
          fi
