# Deploy dataset from data/ to ADLS container ship-survey-csv
# Requires: GitHub repo secret AZURE_CREDENTIALS (service principal JSON)

name: Deploy data to ADLS

on:
  workflow_dispatch:   # Manual run from Actions tab
  push:
    branches: [main]
    paths:
      - 'data/**'

env:
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || 'shipsurveyetl' }}
  ADLS_CONTAINER: ship-survey-csv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload data to ADLS (ship-survey-csv)
        run: |
          az storage blob upload-batch \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --destination "$ADLS_CONTAINER" \
            --source ./data \
            --auth-mode login \
            --overwrite true

      - name: List uploaded blobs
        run: |
          az storage blob list \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$ADLS_CONTAINER" \
            --auth-mode login \
            --output table
