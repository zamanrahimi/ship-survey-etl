# Deploy data to ADLS, then run Synapse serverless SQL (training: step order below).
#
# PREREQUISITE: Run Terraform first (iac/). Set GitHub variable SYNAPSE_WORKSPACE_NAME after Terraform.
#
# PIPELINE STEPS (in order):
#   STEP 1  Checkout repo (so we have data/ and synapse/sql/)
#   STEP 2  Validate Azure secrets (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET)
#   STEP 3  Azure Login (service principal; used for storage and Synapse)
#   STEP 4  Upload data/ to bronze container (ship-bronze-data)
#   STEP 5  List uploaded blobs (verify upload)
#   STEP 6  Run Synapse serverless SQL (bronze → silver) if SYNAPSE_WORKSPACE_NAME is set
#   STEP 7  Upload only the SQL result to silver (e.g. TOP 5 as ship_survey_top5.csv)
#
# Triggers: push to data/** or synapse/**, or manual "Run workflow".

name: Deploy data to ADLS

on:
  workflow_dispatch:   # Manual run from Actions tab
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'synapse/**'

env:
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || 'shipsurveyetl' }}
  ADLS_CONTAINER: ship-bronze-data
  # Synapse serverless SQL: set var SYNAPSE_WORKSPACE_NAME to run bronze→silver SQL after upload. Uses same service principal (Azure AD auth), no Synapse secrets in GitHub.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # STEP 1 – Checkout repo (so workflow has data/ and synapse/sql/)
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 2 – Validate Azure secrets (must be set in repo Settings → Secrets)
      # -----------------------------------------------------------------------
      - name: Validate Azure secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret '$v' is empty or not set. Add it in Settings → Secrets and variables → Actions. If this run is from a fork, secrets are not available—run from the main repo."
              exit 1
            fi
          done
          echo "All required Azure secrets are set."

      # -----------------------------------------------------------------------
      # STEP 3 – Log in to Azure (service principal; used for storage + Synapse)
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: true

      # -----------------------------------------------------------------------
      # STEP 4 – Upload data/ folder to bronze container (ship-bronze-data)
      # -----------------------------------------------------------------------
      - name: Upload data to ADLS (ship-bronze-data)
        env:
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          # Trim key to avoid auth failure from trailing newline when pasted in GitHub secret
          KEY_TRIM="$([ -n "$AZURE_STORAGE_ACCOUNT_KEY" ] && echo "$AZURE_STORAGE_ACCOUNT_KEY" | tr -d '\n\r' || true)"
          if [ -n "$KEY_TRIM" ]; then
            echo "Using account key (AZURE_STORAGE_ACCOUNT_KEY)."
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --destination "$ADLS_CONTAINER" \
              --source ./data \
              --auth-mode key \
              --account-key "$KEY_TRIM" \
              --overwrite true
          else
            echo "Using service principal (login)."
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --destination "$ADLS_CONTAINER" \
              --source ./data \
              --auth-mode login \
              --overwrite true
          fi

      # -----------------------------------------------------------------------
      # STEP 5 – List blobs in bronze (verify upload); Synapse reads from THIS account/container
      # -----------------------------------------------------------------------
      - name: List uploaded blobs
        env:
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          KEY_TRIM="$([ -n "$AZURE_STORAGE_ACCOUNT_KEY" ] && echo "$AZURE_STORAGE_ACCOUNT_KEY" | tr -d '\n\r' || true)"
          echo "Bronze: account=$AZURE_STORAGE_ACCOUNT container=$ADLS_CONTAINER (Synapse reads ship_survey.csv from here)"
          if [ -n "$KEY_TRIM" ]; then
            az storage blob list --account-name "$AZURE_STORAGE_ACCOUNT" --container-name "$ADLS_CONTAINER" --auth-mode key --account-key "$KEY_TRIM" --output table
            BLOB_NAMES=$(az storage blob list --account-name "$AZURE_STORAGE_ACCOUNT" --container-name "$ADLS_CONTAINER" --auth-mode key --account-key "$KEY_TRIM" --query "[].name" -o tsv)
          else
            az storage blob list --account-name "$AZURE_STORAGE_ACCOUNT" --container-name "$ADLS_CONTAINER" --auth-mode login --output table
            BLOB_NAMES=$(az storage blob list --account-name "$AZURE_STORAGE_ACCOUNT" --container-name "$ADLS_CONTAINER" --auth-mode login --query "[].name" -o tsv)
          fi
          if echo "$BLOB_NAMES" | grep -qx 'ship_survey.csv'; then
            echo "OK: ship_survey.csv found in bronze"
          else
            echo "::warning::ship_survey.csv not in bronze. Blob names: $BLOB_NAMES"
          fi

      # -----------------------------------------------------------------------
      # STEP 6 – Run Synapse serverless SQL (e.g. SELECT TOP 5); result is written to silver (step 7)
      # -----------------------------------------------------------------------
      - name: Run Synapse serverless SQL (bronze → silver)
        if: vars.SYNAPSE_WORKSPACE_NAME != ''
        env:
          SYNAPSE_WORKSPACE: ${{ vars.SYNAPSE_WORKSPACE_NAME }}
          SYNAPSE_SQL_USER: ${{ vars.SYNAPSE_SQL_ADMIN_USER || 'sqladmin' }}
          SYNAPSE_SQL_PASSWORD: ${{ secrets.SYNAPSE_SQL_ADMIN_PASSWORD }}
        run: |
          if [ -z "$SYNAPSE_SQL_PASSWORD" ]; then
            echo "::error::Set secret SYNAPSE_SQL_ADMIN_PASSWORD (Synapse SQL admin password from Terraform). Azure AD (sqlcmd -G) does not work on this runner."
            exit 1
          fi
          echo "Running serverless SQL: reading ship_survey.csv from bronze (account=$AZURE_STORAGE_ACCOUNT, container=ship-bronze-data)"
          SERVER="${SYNAPSE_WORKSPACE}-ondemand.sql.azuresynapse.net"
          # Master key password: use secret if set, else generate (key is created once; subsequent runs ignore duplicate)
          MASTER_KEY_PW="${{ secrets.SYNAPSE_DB_MASTER_KEY_PASSWORD }}"
          if [ -z "$MASTER_KEY_PW" ]; then MASTER_KEY_PW=$(openssl rand -base64 24); fi
          sed -e "s/YOUR_STORAGE_ACCOUNT/${AZURE_STORAGE_ACCOUNT}/g" -e "s|YOUR_MASTER_KEY_PASSWORD|${MASTER_KEY_PW}|g" synapse/sql/bronze_to_silver_top5.sql > /tmp/run_bronze_to_silver.sql
          sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc-dev
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Create user database once (EXTERNAL DATA SOURCE not allowed in master); ignore "already exists"
          sqlcmd -S "$SERVER" -d master -U "$SYNAPSE_SQL_USER" -P "$SYNAPSE_SQL_PASSWORD" -I -Q "CREATE DATABASE [ShipSurveyDB]" || true
          # Run script in ShipSurveyDB (credential, data source, SELECT)
          sqlcmd -S "$SERVER" -d ShipSurveyDB -U "$SYNAPSE_SQL_USER" -P "$SYNAPSE_SQL_PASSWORD" -I -i /tmp/run_bronze_to_silver.sql -s "," -W -o /tmp/silver_result.csv
          # Keep only header + data: remove sqlcmd footer, TRY/CATCH "0", warnings, and the dashed separator line
          sed -i '/rows affected)/d' /tmp/silver_result.csv
          sed -i '/^0$/d' /tmp/silver_result.csv
          sed -i '/Potential conversion/d' /tmp/silver_result.csv
          sed -i '/Statement ID/d' /tmp/silver_result.csv
          sed -i '/Query hash/d' /tmp/silver_result.csv
          sed -i '/Distributed request/d' /tmp/silver_result.csv
          sed -i '/Total size of data/d' /tmp/silver_result.csv
          sed -i '/^[-,\t ]*$/d' /tmp/silver_result.csv
          echo "Synapse SQL completed; result in /tmp/silver_result.csv"

      # -----------------------------------------------------------------------
      # STEP 7 – Upload only the SQL result to silver (e.g. TOP 5 rows as ship_survey_top5.csv)
      # -----------------------------------------------------------------------
      - name: Upload SQL result to silver
        if: vars.SYNAPSE_WORKSPACE_NAME != ''
        run: |
          if [ ! -f /tmp/silver_result.csv ]; then
            echo "::warning::No SQL result file; skipping silver upload (Synapse step may have been skipped)."
            exit 0
          fi
          echo "Uploading SQL result (e.g. TOP 5 records) to ship-silver-data..."
          az storage blob upload --account-name "$AZURE_STORAGE_ACCOUNT" --container-name ship-silver-data --name "ship_survey_top5.csv" --file /tmp/silver_result.csv --auth-mode login --overwrite
          echo "Silver upload completed: ship_survey_top5.csv"
