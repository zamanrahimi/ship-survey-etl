# Deploy data to ADLS, then run Synapse serverless SQL (training: step order below).
#
# PREREQUISITE: Run Terraform first (iac/). Set GitHub variable SYNAPSE_WORKSPACE_NAME after Terraform.
#
# PIPELINE STEPS (in order):
#   STEP 1  Checkout repo (so we have data/ and synapse/sql/)
#   STEP 2  Validate Azure secrets (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET)
#   STEP 3  Azure Login (service principal; used for storage and Synapse)
#   STEP 4  Upload data/ to bronze container (ship-bronze-data)
#   STEP 5  List uploaded blobs (verify upload)
#   STEP 6  Run Synapse serverless SQL (bronze → silver) if SYNAPSE_WORKSPACE_NAME is set
#
# Triggers: push to data/** or synapse/**, or manual "Run workflow".

name: Deploy data to ADLS

on:
  workflow_dispatch:   # Manual run from Actions tab
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'synapse/**'

env:
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || 'shipsurveyetl' }}
  ADLS_CONTAINER: ship-bronze-data
  # Synapse serverless SQL: set var SYNAPSE_WORKSPACE_NAME to run bronze→silver SQL after upload. Uses same service principal (Azure AD auth), no Synapse secrets in GitHub.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # STEP 1 – Checkout repo (so workflow has data/ and synapse/sql/)
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 2 – Validate Azure secrets (must be set in repo Settings → Secrets)
      # -----------------------------------------------------------------------
      - name: Validate Azure secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret '$v' is empty or not set. Add it in Settings → Secrets and variables → Actions. If this run is from a fork, secrets are not available—run from the main repo."
              exit 1
            fi
          done
          echo "All required Azure secrets are set."

      # -----------------------------------------------------------------------
      # STEP 3 – Log in to Azure (service principal; used for storage + Synapse)
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: true

      # -----------------------------------------------------------------------
      # STEP 4 – Upload data/ folder to bronze container (ship-bronze-data)
      # -----------------------------------------------------------------------
      - name: Upload data to ADLS (ship-bronze-data)
        env:
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          # Trim key to avoid auth failure from trailing newline when pasted in GitHub secret
          KEY_TRIM="$([ -n "$AZURE_STORAGE_ACCOUNT_KEY" ] && echo "$AZURE_STORAGE_ACCOUNT_KEY" | tr -d '\n\r' || true)"
          if [ -n "$KEY_TRIM" ]; then
            echo "Using account key (AZURE_STORAGE_ACCOUNT_KEY)."
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --destination "$ADLS_CONTAINER" \
              --source ./data \
              --auth-mode key \
              --account-key "$KEY_TRIM" \
              --overwrite true
          else
            echo "Using service principal (login)."
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --destination "$ADLS_CONTAINER" \
              --source ./data \
              --auth-mode login \
              --overwrite true
          fi

      # -----------------------------------------------------------------------
      # STEP 5 – List blobs in bronze (verify upload)
      # -----------------------------------------------------------------------
      - name: List uploaded blobs
        env:
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          KEY_TRIM="$([ -n "$AZURE_STORAGE_ACCOUNT_KEY" ] && echo "$AZURE_STORAGE_ACCOUNT_KEY" | tr -d '\n\r' || true)"
          if [ -n "$KEY_TRIM" ]; then
            az storage blob list \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$ADLS_CONTAINER" \
              --auth-mode key \
              --account-key "$KEY_TRIM" \
              --output table
          else
            az storage blob list \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$ADLS_CONTAINER" \
              --auth-mode login \
              --output table
          fi

      # -----------------------------------------------------------------------
      # STEP 6 – Run Synapse serverless SQL (bronze → silver); only if SYNAPSE_WORKSPACE_NAME is set
      # -----------------------------------------------------------------------
      - name: Run Synapse serverless SQL (bronze → silver)
        if: vars.SYNAPSE_WORKSPACE_NAME != ''
        env:
          SYNAPSE_WORKSPACE: ${{ vars.SYNAPSE_WORKSPACE_NAME }}
        run: |
          echo "Running serverless SQL after data in bronze (Azure AD auth)..."
          SERVER="${SYNAPSE_WORKSPACE}-ondemand.sql.azuresynapse.net"
          sed "s/YOUR_STORAGE_ACCOUNT/${AZURE_STORAGE_ACCOUNT}/g" synapse/sql/bronze_to_silver_top5.sql > /tmp/run_bronze_to_silver.sql
          # Install sqlcmd: use Microsoft config .deb to add repo (installs key without gpg dearmor)
          UBUNTU_VERSION=$(lsb_release -rs)
          UBUNTU_CODENAME=$(lsb_release -cs)
          curl -sL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/ubuntu/${UBUNTU_VERSION}/prod/pool/main/p/packages-microsoft-prod/packages-microsoft-prod_1.1-ubuntu${UBUNTU_VERSION}_all.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc-dev
          export PATH="$PATH:/opt/mssql-tools18/bin"
          sqlcmd -S "$SERVER" -d master -G -I -i /tmp/run_bronze_to_silver.sql
          echo "Synapse SQL (bronze → silver) completed."
