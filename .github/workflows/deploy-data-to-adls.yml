# Deploy dataset from data/ to ADLS container ship-survey-csv
# Requires: GitHub repo secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET (subscription not needed for blob upload)

name: Deploy data to ADLS

on:
  workflow_dispatch:   # Manual run from Actions tab
  push:
    branches: [main]
    paths:
      - 'data/**'

env:
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || 'shipsurveyetl' }}
  ADLS_CONTAINER: ship-survey-csv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret '$v' is empty or not set. Add it in Settings → Secrets and variables → Actions. If this run is from a fork, secrets are not available—run from the main repo."
              exit 1
            fi
          done
          echo "All four Azure secrets are set."

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: true

      - name: Upload data to ADLS (ship-survey-csv)
        run: |
          az storage blob upload-batch \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --destination "$ADLS_CONTAINER" \
            --source ./data \
            --auth-mode login \
            --overwrite true

      - name: List uploaded blobs
        run: |
          az storage blob list \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$ADLS_CONTAINER" \
            --auth-mode login \
            --output table
